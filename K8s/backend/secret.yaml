# WARNING: Do NOT commit this file with real values to git.
# In practice, create it imperatively instead:
#   kubectl create secret generic backend-secret \
#     --namespace flyeasy \
#     --from-literal=DB_HOST=<your-rds-endpoint> \
#     --from-literal=DB_USER=<user> \
#     --from-literal=DB_PASSWORD=<password> \
#     --from-literal=JWT_SECRET=<random-string>
#
# Or better: use AWS Secrets Manager + the External Secrets Operator
# so secrets never live in your repo at all.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: flyeasy
type: Opaque
stringData:
  DB_HOST: "REPLACE_ME_RDS_ENDPOINT"
  DB_USER: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
