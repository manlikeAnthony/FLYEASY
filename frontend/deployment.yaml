apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: flyeasy
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Replace with your ECR image URI, e.g.:
          # 123456789012.dkr.ecr.us-east-1.amazonaws.com/flyeasy-frontend:latest
          image: REPLACE_ME_ECR_REPO/flyeasy-frontend:latest
          ports:
            - containerPort: 80
          env:
            # If your frontend is built to call the backend via a runtime env var
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: BACKEND_INTERNAL_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
