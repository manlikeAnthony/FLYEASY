- hosts: webservers
  become: yes

  tasks:
    - name: Install Git
      apt:
        name: git
        state: present

    - name: Clone repository
      git:
        repo: https://github.com/manlikeAnthony/FLYEASY.git
        dest: /home/ubuntu/flyeasy
        force: yes

    - name: Start FlyEasy
      command:
        cmd: docker-compose up -d --build
        chdir: /home/ubuntu/flyeasy
