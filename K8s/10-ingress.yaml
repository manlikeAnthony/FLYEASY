# Requires the AWS Load Balancer Controller add-on installed in the cluster
# (this provisions an ALB in front of your services)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flyeasy-ingress
  namespace: flyeasy
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Uncomment once you have an ACM cert for HTTPS:
    # alb.ingress.kubernetes.io/certificate-arn: REPLACE_ME_ACM_CERT_ARN
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: REPLACE_ME_your-domain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80