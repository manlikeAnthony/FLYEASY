# NOTE: With the StorageClass in storageclass.yaml (dynamic provisioning),
# a PersistentVolume is created for you automatically when the PVC binds -
# you normally do NOT need to hand-write a PV on EKS.
#
# This file is included because it was requested as a deliverable, and shows
# the STATIC alternative: binding to a pre-existing EBS volume you created
# yourself (e.g. via `aws ec2 create-volume`). Only use this if you need to
# attach a specific, already-existing volume (e.g. one restored from a
# snapshot). Otherwise, skip this file and let the StorageClass handle it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backend-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: flyeasy-ebs-gp3
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: REPLACE_ME_EBS_VOLUME_ID   # e.g. vol-0123456789abcdef0
    fsType: ext4
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.ebs.csi.aws.com/zone
              operator: In
              values:
                - REPLACE_ME_AZ   # e.g. us-east-1a - must match the volume's AZ
