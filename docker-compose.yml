services:
  mongo:
    image: mongo:7
    container_name: flyeasy-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: flyeasy
    volumes:
      - mongo-data:/data/db
    networks:
      - flyeasy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: flyeasy-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/flyeasy
    volumes:
      - backend-logs:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - flyeasy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: flyeasy-frontend
    restart: unless-stopped
    ports:
      - "3002:8080"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flyeasy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  flyeasy-network:
    driver: bridge

volumes:
  mongo-data:
  backend-logs:
