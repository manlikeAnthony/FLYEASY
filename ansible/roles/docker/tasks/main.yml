---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Docker
  apt:
    name:
      - docker.io
    state: present

- name: Install Docker Compose
  apt:
    name:
      - docker-compose
    state: present

- name: Ensure Docker service is started
  service:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
