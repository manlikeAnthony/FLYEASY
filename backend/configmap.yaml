apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: flyeasy
data:
  NODE_ENV: "production"
  PORT: "3000"
  # Point this at the backend Service name + namespace so the frontend
  # (or any internal caller) can resolve it via DNS
  BACKEND_INTERNAL_URL: "http://backend-service.flyeasy.svc.cluster.local"
  # Add any other non-secret config your app reads from env here
  LOG_LEVEL: "info"
