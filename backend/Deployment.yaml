apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: flyeasy
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace with your ECR image URI, e.g.:
          # 123456789012.dkr.ecr.us-east-1.amazonaws.com/flyeasy-backend:latest
          image: REPLACE_ME_ECR_REPO/flyeasy-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: backend-storage
              mountPath: /app/uploads
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: backend-pvc